<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Stepped gradient - ladder effect -->
    <linearGradient id="steppedGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <!-- Bottom - blue #0066CB -->
      <stop offset="0%" stop-color="#0066CB" />
      <stop offset="35%" stop-color="#0066CB" />

      <!-- Step 1 - medium blue -->
      <stop offset="35%" stop-color="#2D8FD9" />
      <stop offset="50%" stop-color="#2D8FD9" />

      <!-- Step 2 - lighter blue -->
      <stop offset="50%" stop-color="#5AAFE6" />
      <stop offset="65%" stop-color="#5AAFE6" />

      <!-- Step 3 - bright blue -->
      <stop offset="65%" stop-color="#87CEF2" />
      <stop offset="80%" stop-color="#87CEF2" />

      <!-- Top - light cyan-blue (visible on both themes) -->
      <stop offset="80%" stop-color="#B4E4FF" />
      <stop offset="100%" stop-color="#B4E4FF" />
    </linearGradient>

    <!-- Add subtle shadow for depth on both themes -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text
    x="50%"
    y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    fill="url(#steppedGradient)"
    font-size="72"
    font-weight="800"
    font-family="system-ui, -apple-system, sans-serif"
    letter-spacing="-0.02em"
    filter="url(#textShadow)"
  >
    MarkDBible
  </text>
</svg>
